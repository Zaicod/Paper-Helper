services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${PAPERFLOW_REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - paperflow-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

volumes:
  paperflow-redis-data:
