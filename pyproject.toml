[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-research-agent"
version = "0.3.0"
description = "A teaching-first multi-agent paper research assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "langgraph>=1.2,<2",
  "mcp>=1.26,<2",
  "openai-agents",
  "pypdf>=5,<7",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]
web = [
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "redis>=5,<7",
  "uvicorn>=0.30,<1",
]
mysql = [
  "pymysql>=1.1,<2",
]

[project.scripts]
paper-agent = "paper_agent.cli:main"
paper-agent-mcp = "paper_agent.mcp_server:main"
paper-agent-feedback = "paper_agent.feedback:main"
paper-agent-web = "paper_agent.web_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_agent = ["web_static/*.html", "web_static/assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
