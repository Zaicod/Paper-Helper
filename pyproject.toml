[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-research-agent"
version = "0.3.0"
description = "A learning-oriented multi-agent paper research assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1,<2",
    "openai>=2,<3",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
rag = [
    "chromadb>=1.5,<2",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.21,<1",
    "huggingface-hub>=0.30,<2",
    "numpy>=2,<3",
]
live = ["openai-agents>=0.6,<1"]
web = [
    "chromadb>=1.5,<2",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.21,<1",
    "huggingface-hub>=0.30,<2",
    "numpy>=2,<3",
    "openai-agents>=0.6,<1",
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "SQLAlchemy>=2,<3",
    "PyMySQL>=1,<2",
    "redis>=5,<9",
    "cryptography>=42,<47",
]
graph = ["langgraph>=1,<2"]
mcp = ["mcp>=1,<2"]

[project.scripts]
paper-agent = "paper_agent.interfaces.cli:main"
paper-agent-web = "paper_agent.interfaces.web:main"
paper-agent-mcp = "paper_agent.interfaces.mcp:main"

[tool.setuptools.packages.find]
include = ["paper_agent*"]
namespaces = false

[tool.setuptools.package-data]
paper_agent = [
    "web_static/*.html",
    "web_static/assets/*.js",
    "web_static/assets/*.css",
    "web_static/assets/*.map",
]
